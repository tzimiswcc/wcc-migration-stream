name: Private source-candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-source-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Candidate-compatible source checks — Ubuntu runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install project-pinned npm in runner-local tooling
        shell: bash
        run: |
          npm_pin="$(node -p "require('./web/package.json').packageManager")"
          npm install --prefix "$RUNNER_TEMP/migration-stream-npm" --no-audit --no-fund --ignore-scripts "$npm_pin"
          echo "$RUNNER_TEMP/migration-stream-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust
        run: rustup default 1.99.1
      - name: Test source-only Linux document-open launcher with synthetic fixtures
        run: python3 -B -m unittest discover -s native/linux -p test_document_open_launcher.py
      - name: Run candidate-compatible source gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci.sh
          python3 -B scripts/markdown-link-check.py --self-test
          python3 -B scripts/markdown-link-check.py
          test -z "$(git status --porcelain --untracked-files=all)"

  windows-source:
    name: Synthetic Windows document-open source checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust source-test toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Test synthetic document-open coordination and native argument projection
        shell: pwsh
        run: cargo +1.99.1 test --locked --test windows_document_open
      - name: Check only the Windows document-open source target with strict Clippy
        shell: pwsh
        run: cargo +1.99.1 clippy --locked --test windows_document_open -- -D warnings
