name: Private source-candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-source-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Candidate-compatible source checks — Ubuntu runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install project-pinned npm in runner-local tooling
        shell: bash
        run: |
          npm_pin="$(node -p "require('./web/package.json').packageManager")"
          npm install --prefix "$RUNNER_TEMP/migration-stream-npm" --no-audit --no-fund --ignore-scripts "$npm_pin"
          echo "$RUNNER_TEMP/migration-stream-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust
        run: rustup default 1.99.1
      - name: Test source-only Linux document-open launcher with synthetic fixtures
        run: python3 -B -m unittest discover -s native/linux -p test_document_open_launcher.py
      - name: Test desktop packaging with synthetic payloads only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/package-macos-engineering-desktop-self-test.py
          python3 -B scripts/package-linux-desktop-self-test.py
          python3 -B scripts/package-windows-desktop-self-test.py
      - name: Run candidate-compatible source gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci.sh
          python3 -B scripts/markdown-link-check.py --self-test
          python3 -B scripts/markdown-link-check.py
          test -z "$(git status --porcelain --untracked-files=all)"

  windows-source:
    name: Synthetic Windows document-open source checks (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            processor: AMD64
            runtime: X64
            toolchain: 1.99.1-x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            processor: ARM64
            runtime: Arm64
            toolchain: 1.99.1-aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check engineering contracts, parse PowerShell and test synthetic preview ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/windows-engineering-preview.ps1
          $tuple=Get-PreviewTarget '${{ matrix.architecture }}'
          Assert-PreviewNativeHost $tuple $env:PROCESSOR_ARCHITECTURE ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()) ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString())
          python -B scripts/windows-engineering-qualification-self-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parseOnly = Join-Path $env:RUNNER_TEMP ('migration-stream-parse-only-' + [Guid]::NewGuid() + '.ps1')
          python -B scripts/windows-engineering-qualification-self-test.py --write-workflow-powershell $parseOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($entry in @(@('builder','scripts/build-assisted-runtime-bundle.ps1'),@('qualification-driver','scripts/windows-engineering-qualification.ps1'),@('qualification',$parseOnly),@('preview-helper','scripts/windows-engineering-preview.ps1'),@('preview-fixtures','scripts/windows-engineering-preview.Tests.ps1'))) {
            if ((Get-Item -LiteralPath $entry[1]).Length -gt 128KB) { Write-Output 'PowerShell source size refused'; exit 1 }
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($entry[1], [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) {
              Write-Output ('PowerShell static parse failed: ' + $entry[0])
              foreach ($errorRecord in @($parseErrors | Select-Object -First 8)) {
                $category = if ($errorRecord.ErrorId -cmatch '^[A-Za-z0-9_]{1,64}$') { $errorRecord.ErrorId } else { 'unknown' }
                Write-Output ('Parse category=' + $category + ' line=' + $errorRecord.Extent.StartLineNumber)
              }
              exit 1
            }
          }
          Write-Output 'PowerShell static parse passed (builder, qualification driver, reviewed workflow blocks, preview helper and fixtures; no product execution)'
          & ./scripts/windows-engineering-preview.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows installer with synthetic files only
        shell: pwsh
        run: |
          python -B scripts/package-windows-desktop-self-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile tiny synthetic NSIS template without installer execution
        if: ${{ matrix.architecture == 'x64' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Required runner-installed NSIS is absent; no download fallback.' }
          Write-Output ('Runner-installed NSIS product version: ' + (Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion)
          python -B scripts/package-windows-desktop-self-test.py --native-compile-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Rust source-test toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./scripts/windows-engineering-preview.ps1
          $tuple=Get-PreviewTarget '${{ matrix.architecture }}'
          $versionLines=@(& rustc +${{ matrix.toolchain }} -vV)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Assert-PreviewRustHost $tuple $versionLines
      - name: Test synthetic document-open coordination and native argument projection
        shell: pwsh
        run: cargo +${{ matrix.toolchain }} test --locked --test windows_document_open
      - name: Test fixed browser request and COM policy with injected calls only
        shell: pwsh
        run: cargo +${{ matrix.toolchain }} test --locked -p migration-stream-windows-native browser_submission_tests
      - name: Test only synthetic native Windows controller processes
        timeout-minutes: 3
        shell: pwsh
        run: cargo +${{ matrix.toolchain }} test --locked --test windows_process_owner_native
      - name: Test create-only engineering layout with synthetic files only
        timeout-minutes: 3
        shell: pwsh
        run: |
          cargo +${{ matrix.toolchain }} test --locked --lib windows_engineering_layout_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +${{ matrix.toolchain }} test --locked --bin migration-stream-windows-engineering-layout
      - name: Check Windows document-open integration and engineering launcher with strict Clippy
        shell: pwsh
        run: cargo +${{ matrix.toolchain }} clippy --locked --lib --test windows_document_open --bin migration-stream-document-open --bin migration-stream-windows-engineering-layout -- -D warnings
      - name: Check native browser test projection with strict Clippy
        shell: pwsh
        run: cargo +${{ matrix.toolchain }} clippy --locked -p migration-stream-windows-native --tests -- -D warnings
