[package]
name = "migration-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Small, dependable migration-readiness ingestion kernel"
publish = false
default-run = "migration-stream"

[workspace]
members = ["crates/migration-stream-windows-native"]
default-members = ["."]
resolver = "3"

[features]
default = []
# Stages an exact native Windows bundle for acceptance-candidate evidence only.
# This feature is not a publication/support switch and does not alter any
# target-matrix status.
windows-native-acceptance-candidate = []

[[bin]]
name = "migration-stream"
path = "src/main.rs"

[[bin]]
name = "migration-stream-workbench"
path = "src/bin/migration-stream-workbench.rs"

[[bin]]
name = "migration-stream-local-runtime"
path = "src/bin/migration-stream-local.rs"

[[bin]]
name = "migration-stream-bundle"
path = "src/bin/migration-stream-bundle.rs"

[dependencies]
app-memory-usage-fetcher = "=0.3.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "=4.5.50", features = ["derive"] }
csv = "=1.4.0"
fs2 = "=0.4.3"
http-body-util = "=0.1.4"
jsonschema = { version = "=0.48.1", default-features = false }
quick-xml = "=0.41.0"
regex = "=1.13.1"
rusqlite = { version = "=0.37.0", features = ["bundled", "chrono", "hooks"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "=0.4.4"
migration-stream-windows-native = { path = "crates/migration-stream-windows-native" }
same-file = "=1.0.6"
winapi-util = "=0.1.11"

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
